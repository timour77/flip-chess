name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Lets the deploy be re-run by hand, e.g. after Pages is first provisioned.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Provisions the Pages site on the first run instead of failing with
          # "Get Pages site failed". Needs the pages: write permission granted
          # above, and is a no-op once the site exists.
          enablement: true

      - name: Install dependencies and build
        run: npm ci && npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
